<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Infinity Love — Наша История</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@200;400;700&family=Caveat:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --accent: #ff4d6d;
            --glass: rgba(255, 255, 255, 0.08);
            --border: rgba(255, 255, 255, 0.2);
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #0a0a0c;
            color: white;
            font-family: 'Exo 2', sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1;
        }

        .container {
            position: relative;
            z-index: 10;
            width: 90%;
            max-width: 450px;
            perspective: 1000px;
        }

        .main-card {
            background: var(--glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 35px;
            padding: 40px 30px;
            text-align: center;
            box-shadow: 0 30px 60px rgba(0,0,0,0.4);
            transform-style: preserve-3d;
            transition: transform 0.1s ease;
        }

        .header h1 {
            font-family: 'Caveat', cursive;
            font-size: 3rem;
            margin: 0 0 10px 0;
            background: linear-gradient(to right, #fff, var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            opacity: 0.6;
            margin-bottom: 40px;
        }

        .timer-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 25px;
        }

        .timer-box {
            flex: 1;
            margin: 0 5px;
            padding: 15px 5px;
            background: rgba(0,0,0,0.2);
            border-radius: 18px;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .num {
            display: block;
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--accent);
            text-shadow: 0 0 15px rgba(255, 77, 109, 0.4);
        }

        .label {
            font-size: 0.6rem;
            opacity: 0.5;
            font-weight: 400;
        }

        .quote-area {
            margin-top: 30px;
            min-height: 60px;
        }

        #dynamic-quote {
            font-family: 'Caveat', cursive;
            font-size: 1.5rem;
            color: #eee;
            line-height: 1.2;
        }

        .btn-notify {
            margin-top: 25px;
            background: none;
            border: 1px solid var(--accent);
            color: var(--accent);
            padding: 12px 25px;
            border-radius: 50px;
            cursor: pointer;
            font-family: 'Exo 2';
            font-weight: 600;
            transition: all 0.3s;
        }

        .btn-notify:hover {
            background: var(--accent);
            color: white;
            box-shadow: 0 0 20px var(--accent);
        }

        .heart-icon {
            font-size: 2rem;
            margin-bottom: 10px;
            filter: drop-shadow(0 0 10px var(--accent));
        }
    </style>
</head>
<body>

<canvas id="bg-canvas"></canvas>

<div class="container">
    <div class="main-card" id="tilt-card">
        <div class="heart-icon">♾️</div>
        <div class="header">
            <h1>Моя Вселенная</h1>
        </div>
        <div class="subtitle">Мы вместе уже:</div>

        <div class="timer-row">
            <div class="timer-box">
                <span class="num" id="d">0</span>
                <span class="label">ДНЕЙ</span>
            </div>
            <div class="timer-box">
                <span class="num" id="h">0</span>
                <span class="label">ЧАСОВ</span>
            </div>
            <div class="timer-box">
                <span class="num" id="m">0</span>
                <span class="label">МИНУТ</span>
            </div>
            <div class="timer-box">
                <span class="num" id="s">0</span>
                <span class="label">СЕКУНД</span>
            </div>
        </div>

        <div class="quote-area">
            <p id="dynamic-quote">Загружаю моменты счастья...</p>
        </div>

        <button class="btn-notify" onclick="initNotifications()">Получать нежность</button>
    </div>
</div>

<script>
    // --- НАСТРОЙКИ ---
    const START_DATE = new Date(2025, 11, 22, 19, 30, 0); 

    // --- ФОНОВЫЕ ЧАСТИЦЫ ---
    const canvas = document.getElementById('bg-canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function initCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }

    class Particle {
        constructor() {
            this.x = Math.random() * canvas.width;
            this.y = Math.random() * canvas.height;
            this.size = Math.random() * 2 + 0.5;
            this.speedX = Math.random() * 0.5 - 0.25;
            this.speedY = Math.random() * 0.5 - 0.25;
            this.opacity = Math.random() * 0.5 + 0.2;
        }
        update() {
            this.x += this.speedX;
            this.y += this.speedY;
            if (this.x > canvas.width) this.x = 0;
            if (this.x < 0) this.x = canvas.width;
            if (this.y > canvas.height) this.y = 0;
            if (this.y < 0) this.y = canvas.height;
        }
        draw() {
            ctx.fillStyle = `rgba(255, 77, 109, ${this.opacity})`;
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fill();
        }
    }

    function createParticles() {
        for (let i = 0; i < 100; i++) particles.push(new Particle());
    }

    function animateParticles() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        particles.forEach(p => {
            p.update();
            p.draw();
        });
        requestAnimationFrame(animateParticles);
    }

    // --- ТАЙМЕР И КОНТЕНТ ---
    function updateApp() {
        const now = new Date();
        const diff = now - START_DATE;

        const d = Math.floor(diff / 86400000);
        const h = Math.floor((diff / 3600000) % 24);
        const m = Math.floor((diff / 60000) % 60);
        const s = Math.floor((diff / 1000) % 60);

        document.getElementById('d').innerText = d;
        document.getElementById('h').innerText = h;
        document.getElementById('m').innerText = m;
        document.getElementById('s').innerText = s;

        updateQuote(now.getHours());
    }

    function updateQuote(hour) {
        const quoteEl = document.getElementById('dynamic-quote');
        let text = "";
        if (hour >= 5 && hour < 12) text = "Доброе утро, любовь моя. Пусть день будет таким же светлым, как ты. ☀️";
        else if (hour >= 12 && hour < 18) text = "Надеюсь, ты улыбаешься прямо сейчас. Ты — моё вдохновение. ✨";
        else if (hour >= 18 && hour < 23) text = "Вечер становится уютнее, когда я думаю о нас. 🌙";
        else text = "Звезды светят ярче, зная, что ты есть в этом мире. Сладких снов. ☁️";
        
        if (quoteEl.innerText !== text) quoteEl.innerText = text;
    }

    // --- ИНТЕРАКТИВ ---
    const card = document.getElementById('tilt-card');
    document.addEventListener('mousemove', (e) => {
        let x = (window.innerWidth / 2 - e.pageX) / 20;
        let y = (window.innerHeight / 2 - e.pageY) / 20;
        card.style.transform = `rotateY(${-x}deg) rotateX(${y}deg)`;
    });

    // --- УВЕДОМЛЕНИЯ ---
    async function initNotifications() {
        const permission = await Notification.requestPermission();
        if (permission === 'granted') {
            alert('Теперь я смогу шептать тебе приятности! ❤️');
            // Здесь логика интервала из прошлого сообщения
        }
    }

    // Запуск
    window.addEventListener('resize', initCanvas);
    initCanvas();
    createParticles();
    animateParticles();
    setInterval(updateApp, 1000);
    updateApp();
</script>

</body>
</html>
